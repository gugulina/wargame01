      h += '<div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:4px">';
      if (isEng) h += '<button data-act="mine" style="flex:1;padding:5px;font-size:11px" ' + (canMine ? '' : 'disabled') + '>布雷</button>';
      h += '<button data-act="clear" style="flex:1;padding:5px;font-size:11px" ' + (canClear ? '' : 'disabled') + '>排雷</button>';
      if (isEng) h += '<button data-act="bridge" style="flex:1;padding:5px;font-size:11px" ' + (canBr ? '' : 'disabled') + '>架桥</button>';
      h += '</div></div>';
    }
    if (u.type === 'sup' && !u.fired) {
      h += '<div class="grp"><button data-act="depot" style="width:100%;padding:5px;font-size:11px">建立补给点（消耗行动）</button></div>';
    }
    const tgs = state.targets.filter(x => x.side === 'red');
    if (tgs.length) {
      h += '<div class="grp"><div class="grp-h">可攻击目标</div>';
      for (const tg of tgs) {
        const pv = previewAttack(u, tg, state.fields);
        const tt = terrainAt(tg.pos[0], tg.pos[1]);
        const dFt = fortAt(tg.pos[0], tg.pos[1]);
        const fortTag = (dFt && dFt.side === tg.side && dFt.maxHp)
          ? ' · <span class="warn">' + FORT[dFt.kind].code + ' 耐久 ' + dFt.hp + '/' + dFt.maxHp + '</span>' : '';
        h += '<div class="tgt ' + (pv.tier <= 3 ? '' : 'bad') + '">' + tg.abbr + ' ' + tg.name +
             '<br><span style="color:#8A867D">' + tg.str + ' 战力 · ' + tt.name +
             ' · 距离 ' + hexDist(u.pos, tg.pos) + '</span>' + fortTag + '<br><b>' + TIER_LABEL[pv.tier] +
             '</b>' + (pv.counter ? (pv.counterSoft ? ' · <span class="warn">对方反击减半</span>' : '') : ' · <span class="ok">对方无法反击</span>') + '</div>';
      }
      h += '</div>';
    } else if (u.fired) {
      h += '<div class="grp"><div class="hint">本回合已行动。</div></div>';
    } else if (u.rng > 0) {
      h += '<div class="grp"><div class="hint">射程内无可攻击目标。' +
           (isArty(u) && !isDirectArty(u) ? '重炮最小射程 2 格，打不了贴脸目标。' : '') + '</div></div>';
    }
  }
  box.innerHTML = h;

  box.querySelectorAll('button[data-act]').forEach(b => {
    b.addEventListener('click', () => {
      const a = b.dataset.act;
      if (a === 'depot') { doDepot(u); return; }
      if (a === 'fort') {
        const k = b.dataset.kind || 'H';
        const same = state.mode === 'fort' && state.fortKind === k;
        state.fortKind = k;
        state.mode = same ? null : 'fort';
      } else {
        state.mode = state.mode === a ? null : a;
      }
      render();
      renderUnitBox();
    });
  });
}

function renderLog() {
  const el = document.getElementById('log');
  el.innerHTML = state.log.slice(-80).map(l =>
    '<div class="' + l.cls + '">' + l.text + '</div>').join('');
  el.scrollTop = el.scrollHeight;
}

/* ───────────────────────── 地图视图：缩放与平移 ───────────────────────── */
/* 桌面端不做任何变换（vK=1），保持原来的原生滚动。
   窄屏下把 #boardView 整体 transform，单指拖动、双指捏合，配合右下角按钮。 */
const boardView = document.getElementById('boardView');
const boardWrap = document.getElementById('boardWrap');

const MQ_NARROW = (typeof matchMedia === 'function')
  ? matchMedia('(max-width: 860px)') : null;
const MQ_LAND = (typeof matchMedia === 'function')
  ? matchMedia('(orientation: landscape)') : null;
function isNarrow() { return !!(MQ_NARROW && MQ_NARROW.matches); }

let vK = 1, vX = 0, vY = 0;      // 当前缩放与平移
let vFit = 1, vMax = 1.6;        // 适应值 / 缩放上限
let supClick = false;            // 拖动或捏合之后抑制一次点击

function boardSize() {
  return {
    w: LEVEL.cols * HEX_W + HEX_W / 2,
    h: (LEVEL.rows - 1) * HEX_H * 0.75 + HEX_H
  };
}
function wrapPad() {
  const cs = getComputedStyle(boardWrap);
  return (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
}
function innerBox() {
  const p = wrapPad();
  return { w: boardWrap.clientWidth - p, h: boardWrap.clientHeight - p };
}
/* 地图区高度上限：竖屏给下面的面板留空间，横屏几乎占满高度 */
function mapCap() {
  const land = MQ_LAND && MQ_LAND.matches;
  return Math.round((window.innerHeight || 640) * (land ? 0.80 : 0.62));
}

/* 把 vX / vY 约束在合理范围：内容比视口小就居中，大就不允许拖出空白 */
function clampView() {
  const { w, h } = boardSize();
  const box = innerBox();
  const cw = w * vK, ch = h * vK;
  vX = cw <= box.w ? (box.w - cw) / 2 : Math.min(0, Math.max(box.w - cw, vX));
  vY = ch <= box.h ? (box.h - ch) / 2 : Math.min(0, Math.max(box.h - ch, vY));
}

function applyView() {
  if (!isNarrow()) {
    boardView.style.transform = '';
    boardWrap.style.height = '';
    return;
  }
  const { h } = boardSize();
  const p = wrapPad();
  const outer = Math.min(Math.round(h * vK), mapCap()) + p + 2;
  boardWrap.style.height = outer + 'px';
  clampView();
  boardView.style.transform =
    'translate(' + vX.toFixed(2) + 'px,' + vY.toFixed(2) + 'px) scale(' + vK.toFixed(4) + ')';
  /* 全图状态下没有东西可拖，就把竖向滑动让给页面滚动，否则玩家会觉得页面卡住 */
  const { w } = boardSize();
  const box = innerBox();
  const needPan = (w * vK > box.w + 1) || (h * vK > box.h + 1);
  boardWrap.style.touchAction = needPan ? 'none' : 'pan-y';
}

/* 适应屏幕：keep=true 时保留当前缩放，只重算边界 */
function fitView(keep) {
  if (!isNarrow()) { vK = 1; vX = 0; vY = 0; applyView(); return; }
  const { w, h } = boardSize();
  const box = innerBox();
  const p = wrapPad();
  /* 全图可见的倍数要同时受宽度和高度限制，否则横屏会算出比屏幕还高的图 */
  const kw = box.w > 0 ? box.w / w : 1;
  const kh = (mapCap() - p) > 0 ? (mapCap() - p) / h : 1;
  vFit = Math.max(0.12, Math.min(1, kw, kh));
  vMax = Math.max(1.6, vFit * 3);
  if (!keep) {
    /* 初始就是「全图可见」：手机上先让玩家看到整个战场，
       太小没法点，所以点格子时会自动放大（见 renderBoard 的 click 处理）。 */
    vK = vFit;
    vX = (box.w - w * vK) / 2;
    vY = 0;
  }
  vK = Math.min(vMax, Math.max(vFit, vK));
  applyView();
}

/* 以视口某点为锚点缩放 */
function zoomAt(k1, ax, ay) {
  const k0 = vK;
  const mx = (ax - vX) / k0, my = (ay - vY) / k0;
  vK = Math.min(vMax, Math.max(vFit, k1));
  vX = ax - mx * vK;
  vY = ay - my * vK;
  clampView(); applyView();
}
function zoomBy(f) {
  const box = innerBox();
  zoomAt(vK * f, box.w / 2, box.h / 2);
}

/* 把某一格带到视野中心（已经在视野内就原地不动，避免乱跳） */
function centerOnCell(r, c, force) {
  if (!isNarrow()) return;
  const box = innerBox();
  const p = hexToPixel(r, c);
  const cx = (p.x + HEX_W / 2) * vK, cy = (p.y + HEX_H / 2) * vK;
  const sx = cx + vX, sy = cy + vY;
  const m = 40;
  if (!force && sx > m && sx < box.w - m && sy > m && sy < box.h - m) return;
  vX = box.w / 2 - cx;
  vY = box.h / 2 - cy;
  clampView(); applyView();
}

/* ── 手势 ── */
let gLast = null;                 // 单指上一帧位置
let gDist = 0;                    // 双指起始间距
let gAnchor = null;               // 双指中心（相对 wrap）

function touchDist(t) {
  const dx = t[0].clientX - t[1].clientX;
  const dy = t[0].clientY - t[1].clientY;
  return Math.hypot(dx, dy) || 1;
}

boardWrap.addEventListener('touchstart', e => {
  if (!isNarrow()) return;
  if (e.touches.length >= 2) {
    gDist = touchDist(e.touches);
    const rc = boardWrap.getBoundingClientRect();
    gAnchor = {
      x: (e.touches[0].clientX + e.touches[1].clientX) / 2 - rc.left,
      y: (e.touches[0].clientY + e.touches[1].clientY) / 2 - rc.top
    };
    gLast = null;
  } else if (e.touches.length === 1) {
    gLast = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    gDist = 0;
  }
}, { passive: true });

boardWrap.addEventListener('touchmove', e => {
  if (!isNarrow()) return;
  if (e.touches.length >= 2 && gDist > 0) {
    e.preventDefault();
    const rc = boardWrap.getBoundingClientRect();
    const ax = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rc.left;
    const ay = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rc.top;
    zoomAt(vK * (touchDist(e.touches) / gDist), ax, ay);
    gDist = touchDist(e.touches);
    gAnchor = { x: ax, y: ay };
    supClick = true;
    gLast = null;
  } else if (e.touches.length === 1 && gLast) {
    const { w, h } = boardSize();
    const box = innerBox();
    /* 全图状态：没有可拖的余量，直接放行给页面滚动 */
    if (w * vK <= box.w + 1 && h * vK <= box.h + 1) { gLast = null; return; }
    const dx = e.touches[0].clientX - gLast.x;
    const dy = e.touches[0].clientY - gLast.y;
    if (Math.abs(dx) + Math.abs(dy) > 2) {
      e.preventDefault();
      vX += dx; vY += dy;
      clampView(); applyView();
      supClick = true;
    }
    gLast = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }
}, { passive: false });

boardWrap.addEventListener('touchend', e => {
  if (!isNarrow()) return;
  if (e.touches.length === 1) {
    gLast = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    gDist = 0;
  } else if (e.touches.length === 0) {
    gLast = null; gDist = 0; gAnchor = null;
  }
  if (supClick) setTimeout(() => { supClick = false; }, 320);
}, { passive: true });

/* ── 按钮与重排 ── */
document.getElementById('zIn').addEventListener('click', () => zoomBy(1.28));
document.getElementById('zOut').addEventListener('click', () => zoomBy(1 / 1.28));
document.getElementById('zFit').addEventListener('click', () => { fitView(false); });
document.getElementById('zHome').addEventListener('click', () => {
  const u = state.selected;
  const t = u ? u.pos : state.terrainSel;
  if (!t) { fitView(false); return; }
  fitView(true);
  centerOnCell(t[0], t[1], true);      // 强制居中，避免 vX/vY 停在半路
});

let rzT = 0;
window.addEventListener('resize', () => {
  clearTimeout(rzT);
  rzT = setTimeout(() => fitView(true), 120);
});
window.addEventListener('orientationchange', () => setTimeout(() => fitView(false), 220));
if (MQ_NARROW && MQ_NARROW.addEventListener) {
  MQ_NARROW.addEventListener('change', () => setTimeout(() => fitView(false), 60));
}
if (MQ_LAND && MQ_LAND.addEventListener) {
  MQ_LAND.addEventListener('change', () => setTimeout(() => fitView(false), 120));
}

/* 手势提示：进窄屏先给一句，4 秒淡出，一碰地图或点击就立刻消失 */
function hideZhint() {
  const z = document.getElementById('zhint');
  if (z) z.classList.add('gone');
}
setTimeout(hideZhint, 4200);
boardWrap.addEventListener('touchstart', hideZhint, { passive: true, once: true });

/* ───────────────────────── 事件绑定 ───────────────────────── */
document.getElementById('btnEnd').addEventListener('click', () => { FX.sfx('uiClick'); endBluePhase(); });
document.getElementById('btnReset').addEventListener('click', () => { FX.sfx('uiClick'); newGame(); });
document.getElementById('mBtn').addEventListener('click', () => { FX.sfx('uiClick'); newGame(); });

newGame();
/* 首帧之后按屏幕尺寸决定要不要缩放（移动端竖屏会缩到能看清的倍数） */
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(() => fitView(false));
else fitView(false);

/* 截图 / 演示用锚点 */
if (typeof location !== 'undefined') {
  const q = location.search;
  if (q.indexOf('demo=unit') >= 0) select(uid('B1B'));
  else if (q.indexOf('demo=at') >= 0) select(uid('B2T'));
  else if (q.indexOf('demo=engb') >= 0) select(uid('B2E'));
  else if (q.indexOf('demo=eng') >= 0) select(uid('B1E'));
  else if (q.indexOf('demo=fort') >= 0) {
    doFort(uid('B2E'), [12, 2], 'P');
    doFort(uid('B1E'), [12, 3], 'H');
    select(uid('B1B'));
  }
  else if (q.indexOf('demo=pa') >= 0) {
    /* 展示炮台：要塞炮打到半血 + 岸防炮 + 旁边一个敌军方便看自动开火 */
    doFort(uid('B2E'), [12, 2], 'P');
    const pf = fortAt(12, 2);
    if (pf) pf.hp = 3;
    const foe = uid('R3A');
    if (foe) foe.pos = [10, 2];
    selectTerrain(12, 2);
  }
  else if (q.indexOf('demo=terrain') >= 0) selectTerrain(6, 9);
}

/* 测试钩子 */
window.__WAR__ = {
  LEVEL, TERRAIN, TYPE, CRT, TIER_LABEL, ASSETS, FX,
  getState: () => state,
  newGame, alive, uid, unitAt, terrainAt, cheb, hexDist, neighbors,
  computeReach, previewAttack, targetsFor, supplyOf, effStr,
  doMove, doAttack, endBluePhase, settlePhase, judgeFinal, render,
  objectiveControl, ctrlState, updateControl, checkEvents, applyEffect, modAtk, modDef, spawnGroup,
  fortAt, fortDef, doFort, FORT, FORT_KEYS, fortKindsFor, fortKind, fortReqOk,
  fortFire, fortAlive, fortWorking, fortSuppressed, damageFort, ARM_FIRE,
  isDirectArty, attackRange, aaPenalty, minRange, canCounter,
  blueScore, redScore, canCounter, isArty, canCapture,
  isHQ, hqBonus, homeBonus, hqRadius, hqAura, makeUnit,
  HQ_TYPES, ARTY_TYPES, CAPTURE_TYPES,
  /* 视图控制（窄屏缩放/平移），供自动化测试读取状态 */
  view: {
    fitView, zoomBy, centerOnCell, isNarrow, boardSize, innerBox,
    get k() { return vK; }, get x() { return vX; }, get y() { return vY; },
    get maxK() { return vMax; }, get fitK() { return vFit; }
  },
  runAI
};
